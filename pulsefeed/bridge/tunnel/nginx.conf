# nginx reverse proxy in front of pulsefeed-bridge.
# The bridge does authorization; nginx does TLS, HSTS and coarse rate limits.

limit_req_zone $binary_remote_addr zone=pulsefeed:10m rate=4r/s;

upstream pulsefeed_bridge {
    server 127.0.0.1:8443;
    keepalive 4;
}

server {
    listen 443 ssl http2;
    server_name pulsefeed.example.com;

    ssl_certificate     /etc/letsencrypt/live/pulsefeed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulsefeed.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 64k;

    location / {
        limit_req zone=pulsefeed burst=20 nodelay;

        proxy_pass         http://pulsefeed_bridge;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The device is a single-threaded web server. Short timeouts keep
        # one stuck client from occupying the only connection it has.
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;
    }

    # Health checks must not consume the request budget.
    location = /healthz {
        proxy_pass http://pulsefeed_bridge/healthz;
        access_log off;
    }
}

server {
    listen 80;
    server_name pulsefeed.example.com;
    return 301 https://$host$request_uri;
}
